/* Layout: a full-bleed pixel town on canvas; HUD pinned to the edges; challenges rise as a paper sheet over the town. */
:root {
  color-scheme: light;
  --ground: #EFF8F3; --ink: #132826; --teal: #0F5C5A; --sun: #F6B73C; --sun-edge: #C98E1E; --blue: #2F5FD0;

  --paper: #FFF9EC; --paper-edge: #E6D6B2; --night: #10312F; --card: #FFFFFF;
  --display: "Baloo 2", "Trebuchet MS", system-ui, sans-serif;
  --arabic: "Baloo Bhaijaan 2", "Noto Naskh Arabic", "Geeza Pro", serif;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; overflow: hidden; background: var(--night); color: var(--ink); font-family: var(--display); font-size: 17px; line-height: 1.35; }
button { font-family: inherit; color: inherit; cursor: pointer; border: 0; background: none; }
button:focus-visible { outline: 3px solid var(--blue); outline-offset: 2px; }
.ar { font-family: var(--arabic); direction: rtl; unicode-bidi: isolate; font-weight: 700; }
canvas#world { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }

/* HUD */
#top { position: fixed; top: env(safe-area-inset-top, 0px); left: 0; right: 0; z-index: 5; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; pointer-events: none;
  padding: 10px max(12px, env(safe-area-inset-right, 0px)) 0 max(12px, env(safe-area-inset-left, 0px)); }
#top > * { pointer-events: auto; }
.pill { background: var(--paper); border: 3px solid var(--night); border-radius: 12px; min-height: 48px; padding: 4px 12px; display: flex; align-items: center; gap: 8px; font-weight: 800; box-shadow: 0 3px 0 var(--night); }
#where { margin-inline-end: auto; flex-direction: column; align-items: flex-start; gap: 0; line-height: 1.15; justify-content: center; }
#where small { color: var(--muted); font-size: 13px; font-weight: 700; }
#bag { gap: 3px; direction: rtl; }
#bag i { font-style: normal; width: 28px; height: 32px; border-radius: 7px; display: grid; place-items: center; font-family: var(--arabic); font-size: 20px; font-weight: 700; background: #E8E0CC; color: #B8AD93; }
#bag i.on { background: var(--teal); color: #fff; }
#top button.pill { min-width: 48px; justify-content: center; }
#bottom { position: fixed; bottom: env(safe-area-inset-bottom, 0px); left: 0; right: 0; z-index: 5; display: flex; gap: 8px; align-items: flex-end; justify-content: center; pointer-events: none;
  padding: 0 max(12px, env(safe-area-inset-right, 0px)) 12px max(12px, env(safe-area-inset-left, 0px)); }
#bottom > * { pointer-events: auto; }
#rami { flex: 0 1 620px; min-width: 0; display: flex; gap: 10px; align-items: center; background: var(--paper); border: 3px solid var(--night); border-radius: 14px; padding: 8px 12px; box-shadow: 0 3px 0 var(--night); font-weight: 600; min-height: 64px; }
#rami.ok { border-color: var(--green-ink); box-shadow: 0 3px 0 var(--green-ink); }
#rami.no { border-color: var(--orange-ink); box-shadow: 0 3px 0 var(--orange-ink); }
#rami img { width: 44px; height: 44px; image-rendering: pixelated; flex: none; }
#ramiText { min-width: 0; }
#ramiText .ar { font-size: 1.25em; color: var(--teal); }
#action { flex: none; min-height: 64px; min-width: 64px; padding: 0 16px; border-radius: 14px; background: var(--sun); box-shadow: 0 4px 0 var(--sun-edge); font-weight: 800; font-size: 18px; }
#action:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--sun-edge); }

/* Sheets */
#veil { position: fixed; inset: 0; z-index: 10; display: flex; overflow-y: auto; background: rgba(16, 49, 47, .62); padding-block: 12px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.sheet { margin: auto; width: min(620px, 100%); background: var(--paper); border: 4px solid var(--night); border-radius: 18px; box-shadow: 0 8px 0 var(--night); padding: 18px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; animation: rise .22s ease-out; }

.sheet h2 { margin: 0; font-size: 28px; line-height: 1.1; color: var(--teal); font-weight: 800; text-wrap: balance; }

.note { font-size: 14px; color: var(--muted); }

.btn { min-height: 56px; padding: 0 22px; border-radius: 14px; font-weight: 800; font-size: 19px; }
.btn.go { background: var(--sun); box-shadow: 0 4px 0 var(--sun-edge); }
.btn.go:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--sun-edge); }

.play { flex: none; width: 48px; height: 48px; border-radius: 12px; background: #E4EBFB; color: var(--blue); font-size: 18px; font-weight: 800; }

.reply .pick small { display: block; font-weight: 600; font-size: 14px; color: var(--muted); }
.reply .pick .ar { font-size: 24px; display: block; }
.reply.right .pick { border-color: var(--green); background: #E5F4EC; }
.reply.wrong .pick { border-color: var(--orange); background: #FDEEDC; animation: nudge .3s; }
.reply .play { height: auto; min-height: 48px; }
@keyframes nudge { 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }
.feedback { min-height: 26px; font-weight: 800; }
.feedback.ok { color: var(--green-ink); }
.feedback.no { color: var(--orange-ink); }
.choices { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.choice { min-height: 96px; background: var(--card); border: 3px solid var(--paper-edge); border-radius: 14px; font-family: var(--arabic); font-size: 46px; font-weight: 700; line-height: 1; display: grid; place-items: center; padding: 6px; }
.choice img { width: 72px; height: 72px; image-rendering: pixelated; }
.choice.right { border-color: var(--green); background: #E5F4EC; }
.choice.wrong { border-color: var(--orange); background: #FDEEDC; }
.prompt { display: flex; gap: 12px; align-items: center; justify-content: center; font-weight: 800; font-size: 20px; text-align: center; }
.prompt .ar { font-size: 56px; line-height: 1.1; color: var(--teal); }
.dots { display: flex; flex-wrap: wrap; gap: 4px; }
.dots i { width: 14px; height: 14px; border-radius: 4px; background: #E8E0CC; display: grid; place-items: center; font-size: 10px; font-style: normal; color: #fff; font-weight: 800; }
.dots i.ok { background: var(--green); }
.dots i.no { background: var(--orange); }
.dots i.now { outline: 2px solid var(--night); }
.slots { display: flex; gap: 8px; justify-content: center; direction: rtl; }
.slot, .tile { width: 72px; height: 72px; border-radius: 12px; display: grid; place-items: center; font-family: var(--arabic); font-size: 40px; font-weight: 700; line-height: 1; }
.slot { border: 3px dashed var(--paper-edge); background: #FFFDF6; }
.slot.full { border: 3px solid var(--green); background: #E5F4EC; }
.tiles { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; direction: rtl; }
.tile { background: #E9E2D0; box-shadow: inset 0 -5px 0 #C6BBA2, 0 3px 0 rgba(0,0,0,.2); }
.tile.wrong { animation: nudge .3s; background: #FBDDB8; }
.slots.words .slot, .tiles.words .tile { width: auto; min-width: 88px; padding: 0 12px; font-size: 28px; }
.slots.words { flex-wrap: wrap; }
.prompt .copyline .ar { font-size: 30px; line-height: 1.35; }
.gap { text-align: center; font-size: 34px; margin: 6px 0 14px; }
.gap .hole { display: inline-block; min-width: 2.4em; border-bottom: 3px dashed var(--paper-edge); color: var(--green); }
.trace { width: min(300px, 100%); aspect-ratio: 1; margin: 0 auto; display: block; background: var(--card); border: 3px solid var(--paper-edge); border-radius: 16px; touch-action: none; }
.meter { height: 12px; border-radius: 6px; background: #E8E0CC; overflow: hidden; }
.meter i { display: block; height: 100%; width: 0; background: var(--green); }
.bars { display: grid; gap: 8px; }
.bar { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 10px; font-weight: 800; }
.bar span:nth-child(2) { font-variant-numeric: tabular-nums; color: var(--teal); }
.bar .meter { grid-column: 1 / -1; }
.stars { display: flex; gap: 6px; justify-content: center; font-size: 46px; line-height: 1; color: #E2D9C2; }

fieldset { border: 0; margin: 0; padding: 0; display: grid; gap: 6px; }
legend { font-weight: 800; padding: 0; margin-bottom: 6px; }

    for (const h of home) world.push({ kind: 'crate', x: h.x, y: h.y, hx: h.x, hy: h.y, glyph: h.g, solid: true });
    crates = { done: 0 };
  }
  function addLanterns(l, lit) {
    world = world.filter((o) => !(o.kind === 'lantern' && o.level === l));
    for (const [x, y, g, m] of lanternRow(l.lanterns.at, l.lanterns.glyphs)) world.push({ kind: 'lantern', level: l, x, y, glyph: g + m, sound: LETTER[g].s + ({ [FATHA]: 'a', [KASRA]: 'i', [DAMMA]: G.lang === 'fr' ? 'ou' : 'u' })[m], lit, solid: true });
  }
  function setupPond() {
    const p = lv().pond, { path, basket } = pondShape(p.at), [x0, y0] = p.at;
    const safe = new Set(path.map((q) => q.join()));
    const rs = [p.letter, p.letter + FATHA, p.letter + KASRA, p.letter + DAMMA], others = p.others;
    for (let y = y0; y <= y0 + 3; y++) for (let x = x0; x <= x0 + 6; x++) {
      const s = safe.has(x + ',' + y);

    }

  }

  // ---------- movement ----------
  const WALK_MS = 150;
  const keys = new Set();
  let path = [], tapTarget = null, shake = 0;
  const DIRS = { 0: [0, 1], 1: [0, -1], 2: [-1, 0], 3: [1, 0] };
  const dirOf = (dx, dy) => (dy > 0 ? 0 : dy < 0 ? 1 : dx < 0 ? 2 : 3);

  function attempt(dx, dy) {
    hero.dir = dirOf(dx, dy);
    const x = hero.x + dx, y = hero.y + dy;
    if (!bump(x, y, dx, dy)) return false;
    if (blocked(x, y) && !(kind(x, y) === '~' && padWalk(x, y))) return false;
    hero.fromX = hero.x; hero.fromY = hero.y; hero.x = x; hero.y = y; hero.moving = 1;
    bot.x = hero.fromX; bot.y = hero.fromY;

    return true;
  }
  const padWalk = (x, y) => { const o = objAt(x, y); return o && o.kind === 'pad' && o.safe; };

  /** Handles walking into something; returns false when the hero should stay put. */
  function bump(x, y, dx, dy) {
    const n = npcAt(x, y);
    if (n) { talkTo(n); return false; }
    const c = cousinAt(x, y);
    if (c) { if (seek && c === seek.c) seekFound(); else meetCousin(c); return false; }
    const ci = catAt(x, y);
    if (ci >= 0) { petCat(ci); return false; }
    if (isDoor(x, y)) { knock(); return false; }
    const sp = spotAt(x, y);
    if (sp) { if (sp.kind === 'rod') fishGame(); else ballGame(); return false; }
    const house = houseAt(x, y);
    if (house && bread) { knockBread(house); return false; }
    const o = objAt(x, y);
    if (!o && kind(x, y) === '~') { fishGame(); return false; } // during the pond puzzle every water tile holds a stone
    if (!o) return true;
    if (o.kind === 'stone') { touchStone(o); return false; }
    if (o.kind === 'crate') { pushCrate(o, dx, dy); return false; }
    if (o.kind === 'lantern') { touchLantern(o); return false; }
    if (o.kind === 'pad') return touchPad(o);
    if (o.kind === 'basket') { const [lx, ly] = pondShape(lv().pond.at).land; o.gone = true; sfx('ok'); tally('read', true); hero.x = hero.px = lx; hero.y = hero.py = ly; bot.x = lx + 1; bot.y = ly; rami(tc('pondDone')(npcName()), 'ok'); advance(); return false; }
    return true;
  }

  function touchStone(o) {
    if (!hunt) return;
    const want = hunt.order[0], name = LETTER[want][G.lang];
    tally('read', !!o.right);
    if (o.right) {
      o.gone = true; sfx('pick'); hunt.left--; burst(o.x, o.y, true);
      speak(LETTER[want].n);
      if (hunt.left > 0) rami(tc('huntLeft')(hunt.left), 'ok');
      else {
        hunt.order.shift();
        if (hunt.order.length) { spawnHunt(); rami(tc('huntNext')(LETTER[hunt.order[0]][G.lang], ar(hunt.order[0]))); speak(LETTER[hunt.order[0]].n); }
        else { rami(tc('huntDone')(npcName()), 'ok'); world = world.filter((w) => w.kind !== 'stone'); advance(); }
      }
    } else {
      sfx('no'); burst(o.x, o.y, false); shake = 8;
      hunt.wrong++;
      rami(tc('huntWrong')(ar(o.glyph), name) + (hunt.wrong >= 2 ? ' ' + tc('huntGlow') : ''), 'no');
      if (hunt.wrong >= 2) for (const w of world) if (w.kind === 'stone' && w.right) w.glow = true;
    }
  }
  function pushCrate(o, dx, dy) {
    if (!crates) return;
    const nx = o.x + dx, ny = o.y + dy, under = world.find((w) => w.kind === 'mark' && w.x === nx && w.y === ny);
    if (o.placed || SOL[ny * W + nx] || world.find((w) => w.solid && w.x === nx && w.y === ny && !w.gone) || kind(nx, ny) !== ';') { shake = 4; return; }
    o.x = nx; o.y = ny; sfx('push');
    hero.fromX = hero.x; hero.fromY = hero.y; hero.x += dx; hero.y += dy; hero.moving = 1; bot.x = hero.fromX; bot.y = hero.fromY;
    if (under) {
      tally('read', under.glyph === o.glyph);
      if (under.glyph === o.glyph) {
        o.placed = true; o.solid = true; crates.done++; sfx('ok'); burst(o.x, o.y, true); speak(LETTER[o.glyph].n);
        rami(tc('cratesRight'), 'ok');
        if (crates.done === 3) { rami(tc('cratesDone')(npcName()), 'ok'); advance(); }
      } else { sfx('no'); burst(o.x, o.y, false); o.x = o.hx; o.y = o.hy; rami(tc('cratesWrong'), 'no'); }
    }
    hud();
  }
  function playLantern() { if (lantern && lantern.queue[0]) speak(lantern.queue[0].glyph); }
  function touchLantern(o) {
    if (!lantern) return;
    if (o.lit) return;
    const want = lantern.queue[0];
    tally('read', o === want);
    if (o === want) {
      o.lit = true; lantern.queue.shift(); sfx('ok'); burst(o.x, o.y, true); rami(tc('lanternRight')(o.sound), 'ok');
      if (lantern.queue.length) setTimeout(playLantern, 900);
      else { rami(tc('lanternDone')(npcName()), 'ok'); advance(); }
    } else { sfx('no'); burst(o.x, o.y, false); shake = 6; rami(tc('lanternWrong')(o.sound), 'no'); speak(o.glyph); setTimeout(playLantern, 1200); }
  }
  function touchPad(o) {
    if (!pond) return false;
    tally('read', o.safe);
    if (o.safe) { sfx('hop'); pond.stepped.add(o.x + ',' + o.y); o.on = true; return true; }
    sfx('no'); burst(o.x, o.y, false); o.sunk = 30; shake = 8; pond.wrong++;
    for (const w of world) if (w.kind === 'pad') w.on = false;
    rami(tc('pondWrong')(ar(o.glyph)) + (pond.wrong >= 2 ? ' ' + tc('pondGlow') : ''), 'no');
    if (pond.wrong >= 2) for (const w of world) if (w.kind === 'pad' && w.safe) w.glow = true;
    const [sx, sy] = pondShape(lv().pond.at).start; hero.x = hero.px = sx; hero.y = hero.py = sy; bot.x = sx + 1; bot.y = sy; hero.moving = 0; path = [];
    return false;
  }
  function petCat(i) {
    const fresh = !G.cats.includes(i);
    if (fresh) { G.cats.push(i); noteEvent('petted a cat'); save(); }
    sfx('meow'); burst(CATS[i][0], CATS[i][1], true, '♥');
    rami(G.cats.length === 5 ? t().catsAll : t().cat(G.cats.length), 'ok');
    if (fresh) taskHit('cats');
    hud();
  }

  // Tap to walk: a breadth-first path; the last step may be a bump into the target.
  function route(tx, ty) {
    if (tx === hero.x && ty === hero.y) return [];
    const k = (x, y) => y * W + x, prev = new Map([[k(hero.x, hero.y), null]]), q = [[hero.x, hero.y]];
    while (q.length) {
      const [x, y] = q.shift();
      for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
        const nx = x + dx, ny = y + dy, id = k(nx, ny);
        if (prev.has(id) || nx < 0 || ny < 0 || nx >= W || ny >= H) continue;
        if (nx === tx && ny === ty) {
          prev.set(id, k(x, y));
          const out = []; for (let c = id; c !== k(hero.x, hero.y); c = prev.get(c)) out.unshift([c % W, Math.floor(c / W)]);

        }

      }

  }
  function tapAt(cx, cy) {

    if (x < 0 || y < 0 || x >= W || y >= H) return;
    const o = objAt(x, y);
    // Tall sprites: a tap on a head counts for the person standing below.
    const below = npcAt(x, y + 1) || cousinAt(x, y + 1) || (bread && houseAt(x, y + 1));
    path = route(x, below ? y + 1 : y);
    if (o && o.kind === 'crate' && path.length > 1) path.pop();
    if (o && o.kind === 'pad' && path.length > 1) { rami(tc('pondFar')); path.pop(); }
  }

  // ---------- flow ----------
  const SHEET_STEPS = ['talk', 'trace', 'build', 'spell', 'copy', 'complete', 'check'];
  function advance() {
    const prevOverlay = SHEET_STEPS.includes(step());
    closeSheet();
    G.step++;
    if (G.step >= lv().steps.length) { finishLevel(); return; }
    const s = step();
    if (['hunt', 'crates', 'lanterns', 'pond'].includes(s)) { setupStep(); }
    else if (prevOverlay) { hud(); runStep(); return; }
    else { const keep = world.filter((o) => o.kind === 'lantern'); world = keep; hud(); }
    save();
  }
  function runStep() {
    const s = step(), l = lv();
    if (s === 'talk') talkSheet(l.pairs, { teach: true, title: t().talkTitle(npcName()), who: l.who, done: advance });
    else if (s === 'trace') traceSheet(l.trace, advance);
    else if (s === 'build') buildSheet(l.build, l.extra, { done: () => { advance(); } });
    else if (s === 'spell' || s === 'copy') buildSheet(l[s], l.extra, { mode: s, done: () => { advance(); } });
    else if (s === 'complete') quiz(l.complete.map(makeQ), { title: t().completeTitle(npcName()), who: l.who, done: (r) => {
      if (r.right >= 2) { advance(); } else { rami(t().checkFail, 'no'); closeSheet(); }
    } });
    else if (s === 'check') quiz(l.check.map(makeQ), { title: t().checkTitle(npcName()), who: l.who, done: (r) => {
      if (r.right >= 2) { advance(); } else { rami(t().checkFail, 'no'); closeSheet(); }
    } });
  }
  function talkTo(n) {
    if (aiOn()) { npcChat(n.who); return; }
    const l = LEVELS[n.lvl];
    if (n.lvl === G.level) {
      const s = step();
      if (SHEET_STEPS.includes(s)) { runStep(); return; }
      rami(worldHint(), '');
    } else if (n.lvl > G.level) rami(`${l.npc[L()]}: ${t().notYet(npcName())}`);
    else if (n.who === 'nabil') breadOffer();
    else rami(`${l.npc[L()]}: ${t().npcBusy[n.who]}`);
  }
  const worldHint = () => { const s = step(); if (s === 'hunt' && hunt) return tc('huntStart')(LETTER[hunt.order[0]][G.lang], ar(hunt.order[0])); if (s === 'crates') return tc('cratesStart')(''); if (s === 'lanterns') return tc('lanternStart'); if (s === 'pond') return tc('pondStart')(LETTER[lv().pond.letter][G.lang], ar(lv().pond.letter)); return ''; };

  const reveal = []; // colour waves: { x, y, r, max }
  function finishLevel() {
    const l = lv(), i = G.level;
    const stars = mistakes <= 1 ? 3 : mistakes <= 4 ? 2 : 1;
    G.stars[i] = stars;
    const got = l.letters.map((g) => ar(g)).join(' ');
    const sc = score;
    G.level++; G.step = 0;
    score = { talk: { a: 0, c: 0 }, read: { a: 0, c: 0 }, write: { a: 0, c: 0 } }; mistakes = 0;
    reveal.push({ x: l.at[0], y: l.at[1], r: 0, max: l.r });
    sfx('wave');
    noteEvent(`finished the level ${l.name[0]} with ${stars} of 3 stars`);
    setupStep(); save(); hud();
    const bridge = G.variety === 'msa' ? '' : l.key === 'bakery' ? bridgeCard(BOOK_BREAD[G.variety], 'خُبْز', t().breadIs) : l.key === 'lanterns' ? bridgeCard(form('my_name_is').tr, 'اِسْمِي', t().nameIs) : '';
    show(`<div class="stars" aria-label="${stars} / 3">${[0, 1, 2].map((s) => `<span class="${s < stars ? 'on' : ''}">★</span>`).join('')}</div>
      <h2 style="text-align:center">${t().levelDone(l.name[L()])}</h2>
      <p style="text-align:center">${t().levelText(got)}</p>
      ${bars([[t().trackTalk, sc.talk], [t().trackReadOnly, sc.read], [t().trackWrite, sc.write]])}${bridge}
      <div class="row end"><button class="btn go" id="ok" type="button">${t().next}</button></div>`);

  const bridgeCard = (home, book, what) => `<div class="kicker">${t().bridgeTitle}: ${what}</div><div class="bridge"><div><small>${t().home}</small>${home}</div><div><small>${t().book}</small>${ar(book)}</div></div>`;
  const bars = (rows) => `<div class="bars">${rows.filter((r) => r[1].a).map(([n, s]) => `<div class="bar"><span>${n}</span><span>${t().of(s.c, s.a)}</span><div class="meter"><i style="width:${Math.round((s.c / s.a) * 100)}%"></i></div></div>`).join('')}</div>`;

  // ---------- sheets ----------
  const veil = $('veil');
  let gameKey = null; // the open mini-game's keyboard handler; returns true when it used the key
  const show = (html) => { veil.innerHTML = `<div class="sheet" role="dialog" aria-modal="true">${html}</div>`; veil.hidden = false; path = []; keys.clear(); gameKey = null; };
  const closeSheet = () => { veil.hidden = true; veil.innerHTML = ''; gameKey = null; hud(); };
  const portrait = (who) => url(big(GUARDS[who] ? GUARDS[who]() : char(who), 4));

  // Wrong replies to offer: phrases the child has met by this chapter, never one that would also be a right answer.
  const SAME = [['want_water', 'want_juice', 'want_apples'], ['head_hurts', 'tummy_hurts'], ['hello', 'morning_reply'], ['yes', 'im_hungry', 'like_school', 'have_friend', 'washed', 'delicious']];
  const metPhrases = () => new Set(CHAPTERS.slice(0, G.ch + 1).flatMap((c) => [...c.levels.flatMap((l) => l.pairs || []), ...c.guardian.pairs, ...c.finale.pairs]).flat());
  function distractors(ask, ans, n = 2) {
    const met = metPhrases(), right = okForms(ans), same = SAME.find((g) => g.includes(ans)) || [];
    const fine = (k) => k !== ans && k !== ask && met.has(k) && !same.includes(k) && !(k === 'yes' && same.length) && form(k).tr !== form(ans).tr && !right.has(normal(FORMS.msa[k][0]));
    return shuffle(Object.keys(MEANING).filter(fine)).slice(0, n);
  }
  function talkSheet(pairs, { teach, title, who, done, name }) {
    let i = 0, left = false;
    const heroName = NAMES[G.hero];
    const draw = () => {
      if (left) return; // the child walked away while the next line was pending
      if (i >= pairs.length) { done(); return; }
      const [ask, ans] = pairs[i];
      const q = form(ask), right = form(ans);
      const pool = distractors(ask, ans);
      const opts = shuffle([ans, ...pool]);
      const suffix = (k) => (k === 'my_name_is' ? ' ' + heroName : k === 'my_age_is' ? ' 7' : '');
      show(`<div class="kicker">${title}</div>
        <div class="speaker"><img src="${portrait(who)}" alt="">
          <div class="line"><div>${ar(q.ar)}<b>${q.tr}</b><small>${teach ? q.mean : ''}</small></div><button class="play" id="again" type="button" aria-label="${t().listen}">▶</button></div></div>
        <p>${t().says}</p>
        <div class="replies">${opts.map((k) => { const f = form(k); return `<div class="reply" data-k="${k}"><button class="pick" type="button">${ar(f.ar)}${f.tr}${suffix(k)}${teach ? `<small>${f.mean.replace('…', suffix(k) ? suffix(k).trim() : '…')}</small>` : ''}</button><button class="play" type="button" aria-label="${t().listen}">▶</button></div>`; }).join('')}</div>
        <div class="feedback" id="fb" aria-live="polite"></div>
        <div class="row end"><button class="btn plain" id="leave" type="button">${t().back}</button></div>`);
      speak(q.ar);
      $('again').onclick = () => speak(q.ar);
      $('leave').onclick = () => { left = true; closeSheet(); };
      let tried = false, answered = false;
      veil.querySelectorAll('.reply').forEach((row) => {
        const k = row.dataset.k;
        row.querySelector('.play').onclick = () => speak(form(k).ar);
        row.querySelector('.pick').onclick = () => {
          if (answered) return; // a double tap must not skip the next line or the next step

            row.classList.remove('wrong'); void row.offsetWidth; row.classList.add('wrong'); sfx('no');
            const fb = $('fb'); fb.className = 'feedback no'; fb.textContent = '↺ ' + t().wrongReply(form(k).mean);
          }

  }

  async function traceSheet(glyph, done) {
    show(`<div class="kicker">${LETTER[glyph][G.lang]}</div><h2>${t().traceTitle(LETTER[glyph][G.lang])}</h2><p>${t().traceHelp}</p>
      <canvas class="trace" id="tc" width="300" height="300"></canvas>
      <div class="meter"><i id="tm"></i></div>
      <div class="feedback no" id="tfb" aria-live="polite"></div>
      <div class="row end"><button class="btn plain" id="leave" type="button">${t().back}</button><button class="btn plain" id="tclear" type="button">${t().clear}</button><button class="btn plain" id="tskip" type="button">${t().skip}</button></div>`);
    speak(LETTER[glyph].n);
    $('leave').onclick = closeSheet;
    try { await document.fonts.load('220px "Baloo Bhaijaan 2"', glyph); } catch {}
    const c = $('tc'); if (!c) return;
    const g = c.getContext('2d');
    const mask = document.createElement('canvas'); mask.width = mask.height = 300;
    const m = mask.getContext('2d', { willReadFrequently: true });
    m.font = '700 220px "Baloo Bhaijaan 2", serif'; m.textAlign = 'center'; m.textBaseline = 'middle'; m.fillText(glyph, 150, 155);
    const md = m.getImageData(0, 0, 300, 300).data;
    const ink = mk(300, 300, () => {}), ig = ink.getContext('2d', { willReadFrequently: true });
    let total = 0; for (let i = 3; i < md.length; i += 4) if (md[i] > 100) total++;
    const paint = () => { g.clearRect(0, 0, 300, 300); g.globalAlpha = .28; g.drawImage(mask, 0, 0); g.globalAlpha = 1; g.drawImage(ink, 0, 0); };
    paint();
    let down = false, last = null, finished = false;
    const pos = (e) => { const r = c.getBoundingClientRect(); return [(e.clientX - r.left) * 300 / r.width, (e.clientY - r.top) * 300 / r.height]; };
    const measure = () => {
      const d = ig.getImageData(0, 0, 300, 300).data;
      let on = 0, off = 0;
      for (let i = 3; i < d.length; i += 4) if (d[i] > 40) { if (md[i] > 100) on++; else off++; }
      const cover = on / total;
      $('tm').style.width = Math.min(100, Math.round(cover / .72 * 100)) + '%';
      if (!finished && cover >= .72 && off < total * 1.6) { finished = true; tally('write', true); sfx('ok'); setTimeout(done, 700); }
      else if (off >= total * 1.6) { $('tfb').textContent = '↺ ' + t().traceMessy; }
    };
    c.onpointerdown = (e) => { down = true; last = pos(e); c.setPointerCapture(e.pointerId); stroke(e); };
    const stroke = (e) => {
      if (!down) return; const p = pos(e);
      ig.strokeStyle = '#0F5C5A'; ig.lineWidth = 26; ig.lineCap = 'round'; ig.lineJoin = 'round';

    };
    c.onpointermove = stroke; c.onpointerup = () => { down = false; }; c.onpointercancel = () => { down = false; };
    $('tclear').onclick = () => { ig.clearRect(0, 0, 300, 300); $('tfb').textContent = ''; paint(); measure(); };
    $('tskip').onclick = () => { if (finished) return; finished = true; tally('write', false); done(); };
  }

  /** Builds a word from pieces. In a quiz (`one`) a wrong order ends the question; otherwise it just bounces back. */
  function buildSheet(wordKey, extra, { done, one, head = '', mode = 'build' }) {
    const w = WORDS[wordKey], parts = w.parts, tiles = shuffle([...parts, extra].filter(Boolean));
    let at = 0, ok = true;
    const pic = `<img src="${url(big(ICONS[w.icon](), 5))}" alt="" style="image-rendering:pixelated;height:72px">`;
    const prompt = mode === 'spell' ? `<span>${t().listen}</span>` : mode === 'copy' ? `${pic}<span class="copyline">${ar(w.ar)}<small style="display:block">${w[G.lang]}</small></span>` : `${pic}<span>${w[G.lang]}</span>`;
    show(`${head}<h2>${t()[mode + 'Title']}</h2><div class="prompt">${prompt}<button class="play" id="again" type="button" aria-label="${t().listen}">▶</button></div>
      <p class="note">${t()[mode + 'Help']}</p>
      <div class="slots${mode === 'copy' ? ' words' : ''}">${parts.map(() => '<div class="slot"></div>').join('')}</div>

  // Question factory: ['hear', letter, mark, letters] | ['name', letter, letters] | ['pic', word, words] | ['talk', ask, ans] | ['build', word, extra]
  function makeQ(q) {
    const [type] = q;
    if (type === 'hear') { const [, g, m, ls] = q; return { track: 'read', type, prompt: () => t().hearQ, audio: g + m, opts: shuffle(ls.map((l) => l + m)), right: g + m }; }
    if (type === 'name') { const [, g, ls] = q; return { track: 'read', type, prompt: () => t().nameQ(LETTER[g][G.lang]), audio: LETTER[g].n, opts: shuffle(ls), right: g }; }
    if (type === 'pic') { const [, w, ws] = q; return { track: 'read', type, prompt: () => t().picQ, word: WORDS[w].ar, audio: WORDS[w].ar, opts: shuffle(ws), right: w, pics: true }; }
    if (type === 'talk') return { track: 'talk', type, ask: q[1], ans: q[2] };
    if (type === 'gap') { const st = SENT[q[1]]; return { track: 'write', type, sent: st, opts: shuffle(st.opts), right: st.answer }; }
    return { track: 'write', type: 'build', mode: type === 'build' ? 'build' : type, word: q[1], extra: q[2] };
  }

  /** A run of questions. Calls done({right, total, per}). Skips count as "not yet". */
  function quiz(qs, { title, who, done }) {
    let i = 0, locked = false; const results = [], per = { talk: { a: 0, c: 0 }, read: { a: 0, c: 0 }, write: { a: 0, c: 0 } };
    const dots = () => `<div class="dots" aria-hidden="true">${qs.map((_, k) => `<i class="${results[k] === true ? 'ok' : results[k] === false ? 'no' : k === i ? 'now' : ''}">${results[k] === true ? '✓' : results[k] === false ? '↺' : ''}</i>`).join('')}</div>`;

          <div class="row end"><button class="btn plain" id="skip" type="button">${t().skip}</button></div>`);

        });

        <div class="choices">${q.opts.map((o) => `<button class="choice" type="button" data-o="${o}" ${q.pics ? `aria-label="${WORDS[o][G.lang]}"` : 'lang="ar"'}>${q.pics ? `<img src="${url(big(ICONS[WORDS[o].icon](), 5))}" alt="">` : o}</button>`).join('')}</div>

  // ---------- side games: optional, never touch the level scores ----------
  const known = () => { const got = [...CHAPTERS.slice(0, G.ch).flatMap((c) => c.levels.flatMap((l) => l.letters)), ...LEVELS.flatMap((l, i) => (i < G.level ? l.letters : []))]; for (const g of chapterLetters()) if (got.length < 3 && !got.includes(g)) got.push(g); return got; };
  const chapterLetters = () => LEVELS.flatMap((l) => l.letters);
  function funStar(id) { if (G.fun.includes(id)) return false; G.fun.push(id); sfx('wave'); hud(); return true; }
  function gameLoop(c, tick, paint) {
    let prev = performance.now();
    const run = (ts) => { if (!c.isConnected) return; const dt = Math.min(50, ts - prev); prev = ts; tick(dt); paint(); requestAnimationFrame(run); };
    requestAnimationFrame(run);
    paint();
    if (window.__rihla) window.__rihla.game = { tick, paint };
  }
  const gameFont = (g, size) => { g.font = `700 ${size}px "Baloo Bhaijaan 2", "Noto Naskh Arabic", serif`; g.textAlign = 'center'; g.textBaseline = 'middle'; };
  const FISH_COLOURS = ['#F28C28', '#C43C3C', '#8A4FBF', '#2F8F6A', '#E3A52A'];

  function fishGame() {
    const GW = 480, GH = 320, BANK = 70, pool = known();
    const asked = G.task && !G.task.done && G.task.kind === 'fish' ? G.task.letter : null;
    if (asked && !pool.includes(asked)) pool.push(asked);
    let wish = null, caught = 0, aim = GW / 2, hook = null;
    const row = (i) => 108 + i * 40;
    const newFish = (i, glyph) => ({ i, x: Math.random() * GW, y: row(i), v: (18 + Math.random() * 22) * (i % 2 ? 1 : -1), glyph, c: FISH_COLOURS[i] });
    const letters = shuffle(pool);
    const fish = [0, 1, 2, 3, 4].map((i) => newFish(i, letters[i % letters.length]));
    const boot = { x: 60 + Math.random() * 360, y: 298, boot: true };
    show(`<div class="kicker">${t().fishTitle}</div>
      <div class="ask"><span id="fwish"></span><button class="play" id="again" type="button" aria-label="${t().listen}">▶</button></div>
      <canvas class="game" id="gc" width="${GW}" height="${GH}" role="img" aria-label="${t().fishHelp}"></canvas>
      <div class="dots" id="fdots" aria-hidden="true"></div>

      const was = wish;
      wish = (asked && !caught ? asked : null) || shuffle(pool).find((l) => l !== was) || pool[0];
      if (!fish.some((f) => f.glyph === wish)) fish[Math.floor(Math.random() * fish.length)].glyph = wish;
      $('fwish').innerHTML = `${t().fishWish} ${LETTER[wish][G.lang]} ${ar(wish)}`;
      speak(LETTER[wish].n);
    };
    const say = (cls, html) => { const fb = $('fb'); fb.className = 'feedback ' + cls; fb.innerHTML = html; };
    const cast = (x, y) => { if (hook) return; aim = x; hook = { x, y: BANK, to: Math.max(BANK + 30, Math.min(GH - 10, y)), up: false, got: null, wait: 0 }; sfx('hop'); };
    const land = () => {
      const f = hook.got; hook = null;
      if (!f) return;
      if (f.boot) { f.y = 298; sfx('no'); say('no', t().fishBoot); return; }
      f.y = row(f.i);
      if (f.glyph !== wish) { sfx('no'); say('no', '↺ ' + t().fishWrong(ar(f.glyph))); speak(LETTER[f.glyph].n); return; }
      caught++; G.fish[f.glyph] = (G.fish[f.glyph] || 0) + 1; save(); sfx('ok'); dotsNow();
      taskHit('fish', f.glyph);
      say('ok', '✓ ' + t().fishRight(ar(f.glyph)));
      fish[fish.indexOf(f)] = newFish(f.i, shuffle(pool)[0]);

    };

      for (const f of fish) {
        if (hook && hook.got === f) continue;
        f.x += f.v * dt / 1000;
        if (f.x < 40 || f.x > GW - 40) { f.v = -f.v; f.x = Math.max(40, Math.min(GW - 40, f.x)); }
      }

        hook.y += dt * .4;

      g.fillStyle = '#8FC57D'; g.fillRect(0, 0, GW, BANK); g.fillStyle = '#7FB86E'; for (let i = 0; i < 12; i++) g.fillRect(i * 41 + 7, 12 + (i * 17) % 46, 8, 3);
      g.fillStyle = '#4FA6C7'; g.fillRect(0, BANK, GW, GH - BANK); g.fillStyle = '#3F93B5'; g.fillRect(0, 200, GW, 60); g.fillStyle = '#34819F'; g.fillRect(0, 260, GW, 60);
      g.fillStyle = '#CFEAF4'; g.fillRect(0, BANK, GW, 3);

      g.fillStyle = '#C43C3C'; g.fillRect(hx - 5, (hook ? hook.y : BANK + 6) - 2, 10, 8);
      g.fillStyle = '#5A3A22'; g.fillRect(boot.x - 18, boot.y - 12, 16, 22); g.fillRect(boot.x - 18, boot.y + 2, 36, 10); g.fillStyle = '#3A2414'; g.fillRect(boot.x - 18, boot.y + 10, 36, 3);
      for (const f of fish) {

  }
